[project]
name = "scheduler_config_editor"
version = "0.1.1"
description = "A program that allows for JSON config modification and schedule generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "course-constraint-scheduler",
    "click",
    "click-shell",
    "PyQt6",
    "tabulate",
    "types-tabulate"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ty",
    "ruff"
]

[tool.uv]
package = true

[project.scripts]
sce = "scheduler_config_editor.main:main"
